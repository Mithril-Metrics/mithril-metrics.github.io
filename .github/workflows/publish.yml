# Render the Quarto blog (HTML + PDF technical notes) and publish it to the gh-pages branch.
# Scheduled publishing: cases whose 00_meta.yml `publish_at:` time has passed are switched from
# draft to published (.github/scripts/release_scheduled.py), committed, and the site is rebuilt.
# Two triggers run this check, because GitHub's own schedule is best-effort (runs can be late or
# dropped): an hourly Cloudflare Worker that calls workflow_dispatch with release_only=true
# (tools/release-trigger-worker.js), and GitHub's schedule every 15 minutes as a backup.
# Checks with nothing to release stop after the check. Running both is harmless.
# Everything runs on GitHub's servers: R, the acutils package and Quarto are installed here,
# so nothing needs to be installed on a laptop to publish.
# The analysis scripts (01-04) are NOT run here: their outputs (output/key_numbers.csv,
# figures) are committed after running them in a local R session.
name: Publish blog

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes, off the hour (backup; may be late or dropped)
  workflow_dispatch:
    inputs:
      release_only:
        description: "Only release due scheduled posts; rebuild only if one was released"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    # Check for scheduled posts; own concurrency group, so it never cancels a queued build.
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.release.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Release scheduled posts (publish_at has passed)
        id: release
        run: |
          released=$(python3 -I .github/scripts/release_scheduled.py)
          if [ -n "$released" ]; then
            echo "Releasing: $released"
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add cases
            git commit -m "Publish scheduled posts: $(echo $released | tr '\n' ' ')"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-deploy:
    needs: release
    # On push or manual runs always build; on the schedule and release-only runs (Cloudflare
    # Worker) only if a post was released.
    if: >-
      (github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.release_only))
      || needs.release.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true      # fast binary packages

      - name: Install R packages (acutils dependencies + rendering)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: acutils
          extra-packages: |
            any::knitr
            any::rmarkdown
            any::yaml

      - name: Install acutils
        run: R CMD INSTALL acutils

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release           # bundles Typst for the PDF briefs

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Stop Quarto writing an unused entry to browser storage
        run: python3 -I .github/scripts/patch_quarto_storage.py _site

      - name: Check that no page loads resources from other sites
        run: python3 -I .github/scripts/check_external.py _site

      - name: Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
