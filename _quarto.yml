project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - people/*.qmd
    - cases/*/report.qmd       # folders starting with "_" (the template) are skipped automatically
  resources:
    - files/                   # CV PDF
    - images/

website:
  title: "Mithril Metrics"
  description: "Short, reproducible analyses of current agri-food, climate and rural policy questions with public data."
  site-url: "https://mithril-metrics.github.io/"
  repo-url: "https://github.com/Mithril-Metrics/mithril-metrics.github.io"
  favicon: images/favicon.png
  image: images/og-default.png          # fallback preview image (1200x630)
  open-graph:
    locale: en_GB
  twitter-card: true
  search: true
  page-navigation: false
  navbar:
    background: light
    left:
      - text: "Case Studies"
        href: index.qmd
      - text: "About"
        menu:
          - text: "The project"
            href: about.qmd
          - text: "Pietro Sala"
            href: people/pietro-sala.qmd
    right:
      - icon: rss
        href: index.xml
        aria-label: RSS feed
      - icon: github
        href: https://github.com/Mithril-Metrics/mithril-metrics.github.io
        aria-label: GitHub
  page-footer:
    left: "© 2026 Mithril Metrics · Text CC BY 4.0 · Code MIT"
    right: "Views are the authors' own."

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    mainfont: "Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    fontsize: 1.05rem
    linestretch: 1.6
    grid:
      body-width: 760px
    toc: false
    code-tools: false
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: false     # GitHub Actions re-renders everything with R on every push
  echo: false
  warning: false
  message: false
