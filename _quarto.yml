project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - questions.qmd            # reader questions page
    - impressum.qmd            # legal notice
    - privacy.qmd              # privacy policy
    - people/*.qmd
    - cases/*/report.qmd       # folders starting with "_" (the template) are skipped automatically
  resources:
    - files/                   # CV PDF
    - fonts/                   # self-hosted Inter (OFL)
    - images/
    - data/                    # public list of open questions (questions page)

website:
  title: "Mithril Metrics"
  draft-mode: unlinked              # drafts render at their URL but are not listed or in the feed
  description: "Reproducible analyses of current agri-food, climate and rural policy questions with public data."
  site-url: "https://mithril-metrics.github.io/"
  repo-url: "https://github.com/Mithril-Metrics/mithril-metrics.github.io"
  favicon: images/favicon.png
  image: images/og-default.png          # fallback preview image (1200x630)
  open-graph:
    locale: en_GB
  twitter-card: true
  search: true
  page-navigation: false
  navbar:
    background: light
    logo: images/logo-mark.svg
    logo-alt: "Mithril Metrics logo"
    left:
      - text: "Case Studies"
        href: index.qmd
      - text: "Research questions"
        href: questions.qmd
      - text: "About"
        menu:
          - text: "The project"
            href: about.qmd
          - text: "Juan Pablo Henao"
            href: people/juan-pablo-henao.qmd
          - text: "Pietro Sala"
            href: people/pietro-sala.qmd
    right:
      - icon: linkedin
        href: https://www.linkedin.com/company/mithril-metrics
        aria-label: LinkedIn
      - icon: rss
        href: index.xml
        aria-label: RSS feed
      - icon: github
        href: https://github.com/Mithril-Metrics/mithril-metrics.github.io
        aria-label: GitHub
  page-footer:
    left: "© 2026 Mithril Metrics · Text CC BY 4.0 · Code MIT"
    right: "Views are the authors' own. · [Legal notice / Impressum](/impressum.html) · [Privacy](/privacy.html)"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    fontsize: 1.05rem
    linestretch: 1.6
    grid:
      body-width: 760px
      margin-width: 260px
    toc: false
    code-tools: false
    smooth-scroll: true
    link-external-newwindow: true
    html-math-method: mathml   # formulas drawn by the browser; no MathJax from a CDN

execute:
  freeze: false     # GitHub Actions re-renders everything with R on every push
  echo: false
  warning: false
  message: false
