issue: 1
local_folder: "Issue 1"
title: "Do El Niño years bring unusually severe rice shortfalls in Southeast Asia?"
question: >
  Are national rice yield shortfalls in Southeast Asia (Viet Nam, Indonesia, Philippines,
  Thailand, Malaysia, Cambodia; 1961-2024) larger and more frequent in El Niño onset years,
  and more extreme than a normal distribution implies?
bottom_line: null                 # written at the WRITE stage from key_numbers.csv
status: code-second-look                      # plan | code | results | red-teamed | published

hook:
  debate: >
    A very strong El Niño (NOAA ONI anomaly +2.46 for Aug-Oct 2026) is expected to peak in late
    2026 and persist into early 2027, threatening rice harvests in Southeast Asia while
    fertiliser costs are already high.
  date: "2026-11-18"
  primary_source:
    title: "NOAA Climate Prediction Center, Oceanic Niño Index"
    url: "https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt"

