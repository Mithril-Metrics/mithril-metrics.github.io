title: "Do El Niño years bring unusually severe rice shortfalls in Southeast Asia?"
question: >
  Are national rice yield shortfalls in Southeast Asia (Viet Nam, Indonesia, Philippines,
  Thailand, Malaysia, Cambodia; 1961-2024) larger and more frequent in El Niño onset years,
  and more extreme than a normal distribution implies?
