hook:
  debate: >
    A strong to very strong El Niño is under way (NOAA CPC, 12 Nov 2026: likely through
    Jan-Mar 2027; ONI +2.46 for Aug-Oct 2026). FAO and WFP launched their first joint
    anticipatory action appeal (Aug 2026). Rice in Southeast Asia is among the most exposed crops.
