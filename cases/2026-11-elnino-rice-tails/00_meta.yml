manual_steps: []

identification: >
  El Niño onset is driven by Pacific ocean dynamics that farmers and governments cannot
  influence, so differences in detrended yield shortfalls between El Niño onset years and
  other years estimate a reduced-form effect of El Niño years, conditional on the detrending.
  Few events, coincident shocks (e.g. 1997-98 Asian financial crisis) and national averaging
  limit precision and external validity.

decisions:                        # pre-specified before seeing results (P4, 2026-11-18)
  countries: [VNM, IDN, PHL, THA, MYS, KHM]
  years: [1961, 2024]
  cambodia_start: 1980            # 1970s values unreliable (conflict years, imputed)
  trend: "log yield ~ natural spline (4 df) per country + Indonesia 2018 level shift (BPS revision)"
  elnino_definition: "mean ONI anomaly Jul-Dec (JAS, ASO, SON, OND) >= 0.5; strong >= 1.5"
  main_timing: "onset year t"
  shortfall_threshold: "yield >= 5% below trend (also 10%)"
  robustness: ["R1: exposure in harvest year t+1", "R2: robust LOESS trend (span 0.5)"]
  inference: "year-block bootstrap, 999 draws"

second_look:                      # ADDED AFTER the main results (2026-11-18), exploratory, script 03b
  why: "Main result null for El Niño; checks chosen on economic grounds before running them"
  checks:
    - "S1: El Niño and La Niña vs ENSO-neutral years"
    - "S2: El Niño effect on yield, harvested area and production, in t and t+1 (distributed lag)"
    - "S3: maritime (IDN, PHL, MYS) vs mainland (THA, VNM, KHM)"
    - "S4: drop major-conflict country-years (UCDP intensity 2); drop 1997-98 (Asian crisis)"

