manual_steps: []

identification: >
  Descriptive benchmarking, not causal. The frontier is the best observed combination of
  cropland, irrigation water and crop output among the countries in the sample, so a gap is
  distance to best practice under a common-technology assumption. Gaps also reflect climate
  (evaporative demand), crop mix and the share of rainfed output, not only water management.

decisions:                        # fixed in the PLAN stage (P4, 2026-11-20), before seeing results
  years: [2020, 2022]             # means of available years; ES and SE report 2020 only
  units: "member states with irrigated area >= 2% of UAA in 2023 (ef_fsi_irri UAA_IT, PC); 1% if fewer than 10"
  water: "env_wat_abs ABS_AGR_IR, FRW, MIO_M3; countries without it in 2020-2022 filled with AQUASTAT agricultural withdrawals (WDI share x total), flagged filled = TRUE and kept in the headline"
  output: "aact_eaa01 itm_newa 10000, EUR million at basic prices; fallback FAOSTAT QV crops gross production value (constant international dollars)"
  land: "FAOSTAT RL cropland, 1000 ha"
  model: "water-directional (sub-vector) DEA, Benchmarking::dea.direct, direction (0, water), VRS, input orientation"
  comparison: "partial productivity: crop output per m3 of irrigation water"
  second_step: "Spearman rank correlation of the water-saving share with WEI+ (mean 2020-2022)"
  robustness:
    - "R1: Eurostat-only sample (drop filled countries); Spearman of the saving ranks with the headline run"
    - "R2: leave one frontier country out of the reference set; range of each country's saving share"
  excluded: "labour (few units; farm labour includes livestock)"

first_run:                        # 2026-11-20, JPH local run; headline NOT final
  crop_output: "aact_eaa01 crop-output code not identified in the bulk table; the pre-specified fallback FAOSTAT QV (constant 2014-2016 int. $) was used"
  sample: "14 member states (MT, EL, CY, NL, IT, PT, ES, DK, FR, RO, DE, HU, SE, AT); 4 filled from AQUASTAT (IT, PT, FR, AT)"
  fill_gap: "median Eurostat irrigation abstraction = 56% of AQUASTAT agricultural withdrawal where both exist, so filled countries carry too much water"
  result: "saving 19% of sample water; 6 of 14 on the frontier (DE, ES, FR, IT, MT, NL); Spearman with WEI+ 0.17 (p 0.55)"
  problems:
    - "Frontier set by largely rainfed countries (DE 3% irrigated, NL) and by VRS end points (MT smallest, ES largest output)"
    - "Leave-one-out moves single shares by up to 86 pp (CY 0-86, EL 0-61): not robust"
    - "Portugal's 97% mixes the AQUASTAT fill bias with rainfed peers"
  status: "superseded by second_run (respecified after these results)"

second_run:                       # 2026-11-20, option 1 chosen by JPH after first_run; run in Claude's session on JPH's cached data_raw
  changes:
    - "Inputs: rainfed cropland and irrigated area (ef_fsi_irri UAA_IT HA, interpolated to 2021 between the 2016 and 2023 surveys) instead of total cropland"
    - "Constant returns to scale instead of VRS"
    - "AQUASTAT fills scaled by the median Eurostat/AQUASTAT ratio (0.56); unscaled kept as diagnostic D1"
  result: "saving 92% of sample water; frontier AT, DE, NL; Spearman with WEI+ 0.81; leave-one-out ranges up to 96 pp (EL 0-96, IT 0-93)"
  diagnosis: >
    The frontier is now set by countries that irrigate little water per hectare because rain covers
    most crop needs (DE 581, NL 594, AT 1,487 m3/ha) against 3,500-8,700 m3/ha in the Mediterranean
    (median 6,290 vs 1,227). Saving shares track water per hectare (Spearman 0.92) and water per
    hectare tracks WEI+ (0.75): the benchmark measures climate and crop mix (NL greenhouses), not
    irrigation management. Not publishable as an efficiency ranking.
  status: "superseded by reframe"

reframe:                          # 2026-11-20, chosen by JPH at P6 after second_run
  format: "Does the assumption hold?"
  question: "Can one EU-wide benchmark rank irrigation water efficiency, or does it mostly measure climate?"
  step1: "Water per irrigated hectare (abstraction / irrigated area interpolated to 2021), Mediterranean-climate member states (CY, EL, ES, IT, MT, PT, fixed a priori) vs the rest"
  step2: "Both frontier specifications (A = first-run model, VRS cropland + water; B = second-run model, CRS rainfed + irrigated land + water), same scaled water; Spearman of savings with water per hectare; leave-one-out for B"
  robustness:
    - "R1: Eurostat-only countries (drop the 4 AQUASTAT fills)"
    - "R2: irrigated area from the 2016 or the 2023 survey instead of the interpolation"
  result: "Mediterranean median 6,290 vs 1,227 m3/ha (5.1x; R1 5.5x, R2 3.8x-5.4x); water per ha vs WEI+ Spearman 0.75; frontier savings 23% (A) or 92% (B) of sample water, Spearman A vs B 0.37, B vs water per ha 0.92; leave-one-out moves single B shares by up to 96 pp"
  not_claimed: "No country is called inefficient; the case does not estimate efficiency net of climate"
  follow_up: "Q020: climate-adjusted frontier with growing-season water deficit (ERA5) as a non-discretionary input"

