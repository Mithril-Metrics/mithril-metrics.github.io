  region: ["EU"]
  method: ["Descriptive comparison", "DEA (diagnostic, technical note only)"]
  employer_theme: ["OECD", "JRC", "IIASA", "FAO"]
  skills: ["DEA / network DEA, SFA, optimisation", "Water pricing, cost recovery, economic instruments"]

dates:
  created: "2026-11-20"
  published: null

