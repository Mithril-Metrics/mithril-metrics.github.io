# 00_meta.yml — single source of truth for this case's metadata.
# report.qmd reads this file for the hook, the "Data & code" section and the footer.

id: "2026-11-eu-irrigation-water-productivity"
issue: 3
local_folder: "Issue 3"
author: "Juan Pablo Henao"
title: "Can one EU benchmark rank irrigation water efficiency?"
question: >
  Does a single EU-wide benchmark of irrigation water efficiency compare like with like, or does
  it mostly reflect climate? (Reframed 2026-11-20 from "Which EU countries could save the most
  irrigation water by matching the best performers?" after two frontier runs; see reframe.)
bottom_line: null                 # written at the WRITE stage from key_numbers.csv
status: draft                     # plan | code | results | red-teamed | draft | published
publish_at: "2026-11-27T11:00+01:00"   # approved by JPH and PS on 2026-11-26; hourly check publishes it

hook:
  debate: >
    At the AGRIFISH Council of 26-27 October 2026, France and Portugal, backed by Cyprus,
    Czechia, Hungary and Slovakia, asked for EU action to cut average water use per irrigated
    hectare and to fund agricultural water infrastructure. On 27 October the Commission proposed
    a European Climate Resilience Law that makes water security a mandatory part of national
    climate-risk assessments and plans.
  date: "2026-10-22"
  primary_source:
    title: "Council of the EU (2026), note 14698/26: Taking action at the European level to support the adaptation of agriculture to climate change and to strengthen the water resilience of farms"
    url: "https://data.consilium.europa.eu/doc/document/ST-14698-2026-INIT/x/pdf"
  other_sources:
    - title: "European Commission (27 Oct 2026), Protecting Europe with stronger climate-resilience"
      url: "https://commission.europa.eu/news-and-media/news/protecting-europe-stronger-climate-resilience-2026-10-27_en"

