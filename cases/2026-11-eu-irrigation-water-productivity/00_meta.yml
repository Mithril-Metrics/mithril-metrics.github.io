manual_steps: []

identification: >
  Descriptive, not causal (revised 2026-11-26, see p4_revisit). The post compares irrigation
  abstraction per irrigated hectare between climate groups; the gap mixes climate (evaporative
  demand), crop mix, infrastructure and reporting practice, and we do not separate them. The DEA
  frontier is reported in the technical note only, as a diagnostic: with 10 countries it does not
  identify efficiency (see p4_revisit).

decisions:                        # fixed in the PLAN stage (P4, 2026-11-20), before seeing results
  years: [2020, 2022]             # means of available years; ES and SE report 2020 only
  units: "member states with irrigated area >= 2% of UAA in 2023 (ef_fsi_irri UAA_IT, PC); 1% if fewer than 10"
  water: "env_wat_abs ABS_AGR_IR, FRW, MIO_M3; countries without it in 2020-2022 filled with AQUASTAT agricultural withdrawals (WDI share x total), flagged filled = TRUE and kept in the headline"
  output: "aact_eaa01 itm_newa 10000, EUR million at basic prices; fallback FAOSTAT QV crops gross production value (constant international dollars)"
  land: "FAOSTAT RL cropland, 1000 ha"
  model: "water-directional (sub-vector) DEA, Benchmarking::dea.direct, direction (0, water), VRS, input orientation"
  comparison: "partial productivity: crop output per m3 of irrigation water"
  second_step: "Spearman rank correlation of the water-saving share with WEI+ (mean 2020-2022)"
  robustness:
    - "R1: Eurostat-only sample (drop filled countries); Spearman of the saving ranks with the headline run"
    - "R2: leave one frontier country out of the reference set; range of each country's saving share"
  excluded: "labour (few units; farm labour includes livestock)"

first_run:                        # 2026-11-20, JPH local run; headline NOT final
  crop_output: "aact_eaa01 crop-output code not identified in the bulk table; the pre-specified fallback FAOSTAT QV (constant 2014-2016 int. $) was used"
  sample: "14 member states (MT, EL, CY, NL, IT, PT, ES, DK, FR, RO, DE, HU, SE, AT); 4 filled from AQUASTAT (IT, PT, FR, AT)"
  fill_gap: "median Eurostat irrigation abstraction = 56% of AQUASTAT agricultural withdrawal where both exist, so filled countries carry too much water"
  result: "saving 19% of sample water; 6 of 14 on the frontier (DE, ES, FR, IT, MT, NL); Spearman with WEI+ 0.17 (p 0.55)"
  problems:
    - "Frontier set by largely rainfed countries (DE 3% irrigated, NL) and by VRS end points (MT smallest, ES largest output)"
    - "Leave-one-out moves single shares by up to 86 pp (CY 0-86, EL 0-61): not robust"
    - "Portugal's 97% mixes the AQUASTAT fill bias with rainfed peers"
  status: "superseded by second_run (respecified after these results)"

second_run:                       # 2026-11-20, option 1 chosen by JPH after first_run; run in Claude's session on JPH's cached data_raw
  changes:
    - "Inputs: rainfed cropland and irrigated area (ef_fsi_irri UAA_IT HA, interpolated to 2021 between the 2016 and 2023 surveys) instead of total cropland"
    - "Constant returns to scale instead of VRS"
    - "AQUASTAT fills scaled by the median Eurostat/AQUASTAT ratio (0.56); unscaled kept as diagnostic D1"
  result: "saving 92% of sample water; frontier AT, DE, NL; Spearman with WEI+ 0.81; leave-one-out ranges up to 96 pp (EL 0-96, IT 0-93)"
  diagnosis: >
    The frontier is now set by countries that irrigate little water per hectare because rain covers
    most crop needs (DE 581, NL 594, AT 1,487 m3/ha) against 3,500-8,700 m3/ha in the Mediterranean
    (median 6,290 vs 1,227). Saving shares track water per hectare (Spearman 0.92) and water per
    hectare tracks WEI+ (0.75): the benchmark measures climate and crop mix (NL greenhouses), not
    irrigation management. Not publishable as an efficiency ranking.
  status: "superseded by reframe"

reframe:                          # 2026-11-20, chosen by JPH at P6 after second_run
  format: "Does the assumption hold?"
  question: "Can one EU-wide benchmark rank irrigation water efficiency, or does it mostly measure climate?"
  step1: "Water per irrigated hectare (abstraction / irrigated area interpolated to 2021), Mediterranean-climate member states (CY, EL, ES, IT, MT, PT, fixed a priori) vs the rest"
  step2: "Both frontier specifications (A = first-run model, VRS cropland + water; B = second-run model, CRS rainfed + irrigated land + water), same scaled water; Spearman of savings with water per hectare; leave-one-out for B"
  robustness:
    - "R1: Eurostat-only countries (drop the 4 AQUASTAT fills)"
    - "R2: irrigated area from the 2016 or the 2023 survey instead of the interpolation"
  result: "Mediterranean median 6,290 vs 1,227 m3/ha (5.1x; R1 5.5x, R2 3.8x-5.4x); water per ha vs WEI+ Spearman 0.75; frontier savings 23% (A) or 92% (B) of sample water, Spearman A vs B 0.37, B vs water per ha 0.92; leave-one-out moves single B shares by up to 96 pp"
  not_claimed: "No country is called inefficient; the case does not estimate efficiency net of climate"
  follow_up: "Q020: climate-adjusted frontier with growing-season water deficit (ERA5) as a non-discretionary input"

red_team:                         # P7, 2026-11-20: two independent reviews (EC JRC policy analyst; field-journal econometrician)
  verdicts: {jrc_policy: REVISE, econometrics: REVISE}
  fixes_applied:                  # all chosen by JPH (option 2); outputs rerun 2026-11-20 on JPH's cached data_raw
    - "F1 headline sample = 10 countries with Eurostat irrigation data; 4 AQUASTAT fills shown hollow, outside medians and models (France's 1,080 m3/ha vs about 1,900 in INSEE 2020: https://www.insee.fr/fr/statistiques/7728881)"
    - "F2 'abstract' instead of 'apply' in titles and text"
    - "F3 Fig 2 retitled ('neither estimates saveable water'); crop value per m3 dropped from the main table; leave-one-out in the caption"
    - "F4 2 x 2 specifications: returns to scale moves the share by 87 pp on average, splitting land by 0 pp"
    - "F5 ratio reported as a range over samples and survey years (3.8-6.0) with an exact rank-sum test (p = 0.010, headline sample)"
    - "F6 leave-one-out for models A and B with infeasible runs counted (0 of 63)"
  results_after_fixes: "Mediterranean median 6,561 vs other 1,202 m3/ha (5.5x; range 3.8-6.0); model A 6%, model B 93% of sample water; Spearman A vs B 0.19; B vs crop value per m3 -0.997"
  caveats_for_post:
    - "C1 (both): The gap mixes climate, crop mix, irrigation infrastructure and how countries report the data; we do not separate them."
    - "C2 (econometrics): Model B's 'saving potential' is almost exactly each country's crop value per cubic metre of irrigation water compared with Germany's or the Netherlands'; because most crop output there is rainfed, the model mostly measures how far farming relies on rain."
    - "C3 (JRC): Current EU texts ask each member state to improve on its own baseline, so they avoid this problem. The comparison matters if a per-hectare indicator were used to compare countries or allocate EU funds."
    - "C4 (JRC): National annual averages hide basin and seasonal stress, where abstraction decisions are made. A common per-hectare threshold would put most of the adjustment cost on Mediterranean irrigators; whether that is justified depends on basin-level scarcity, which this post does not measure."
    - "C5 (both): The correlation with WEI+ is partly mechanical, because abstraction enters both measures; it is not used as evidence."
    - "C6 (econometrics): The climate grouping and this framing were chosen after the first two model runs."
  proposed_headline: >
    Across EU member states with Eurostat irrigation data, Mediterranean ones abstract 3.8-6.0 times
    more irrigation water per irrigated hectare than the rest. Because that gap mixes climate, crop
    mix and infrastructure, comparing countries on a per-hectare indicator would mostly show where a
    country is, not how well it irrigates; current EU texts avoid this by measuring each country
    against its own baseline.

p4_revisit:                       # 2026-11-26, chosen by JPH after results (post-results change, disclosed)
  trigger: >
    JPH questioned the DEA: which model, how many observations, whether the sample meets the
    rule of thumb, why VRS vs CRS, and whether a 6% vs 93% gap is credible.
  diagnosis:
    - "Model B (3 inputs, 1 output) needs n >= 12 under the Cooper, Seiford and Tone rule of thumb; n = 10. Model A needs 9 and passes only just."
    - "Under VRS, 5 of 10 countries are on the frontier; under CRS, 2 (Germany, Netherlands)."
    - "Returns to scale moves the saving share by 87 pp on average; splitting land by 0 pp."
    - "Model B's saving share is a near-monotone function of crop value per m3 (Spearman -0.997), and crop value includes rainfed output (0.9 int. $/m3 Cyprus to 63.8 Germany)."
    - "Leave-one-out moves a single share by up to 88 pp (A) and 96 pp (B)."
  decision: >
    Option 1: the descriptive gap (abstraction per irrigated hectare, exact rank-sum test,
    six sample and survey-year variants) is the whole post. The DEA moves to the technical note
    as Section 4, "Why a national frontier gives no answer here" (2 x 2 table with rule-of-thumb
    minimum n, the two-model chart, conclusion). No new models were run; only key numbers were
    added (six variant ratios, rule-of-thumb n, crop value per m3 at the extremes).
  changes: ["Fig 2 = ratio under six variants (fig2_robustness)", "two-model chart -> fig_note_dea (note only)", "key figure '6% or 93%' -> '4 of 4 above all 6 others'", "bottom line, method, findings, caveat 3, method tag and category rewritten", "tab_main descriptive only; per-country DEA in tab_dea.csv"]
  follow_up: "Option 2, regional DEA with a climate input (growing-season water deficit): Q020 in pending_questions."
final_run: >
  2026-11-26, JPH local run (run_all.R, Windows, R 4.6.1) with a fresh download of all sources:
  all 51 key numbers and the result tables are identical to the run on the 2026-11-20 data.
  Outputs and sessionInfo.txt on GitHub are from this run; access dates in sources updated.

