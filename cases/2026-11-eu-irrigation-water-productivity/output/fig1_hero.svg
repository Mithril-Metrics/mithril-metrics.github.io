<text x='15.94' y='429.65' style='font-size: 9.80px;fill: #6B6B66; font-family: "Arial";' textLength='469.61px' lengthAdjust='spacingAndGlyphs'>the 10 countries with Eurostat irrigation data; ratio 3.8-6.0 across samples and survey years; exact rank-sum</text>
<text x='15.94' y='440.23' style='font-size: 9.80px;fill: #6B6B66; font-family: "Arial";' textLength='438.56px' lengthAdjust='spacingAndGlyphs'>p = 0.010. The gap mixes climate, crop mix, infrastructure and reporting. * No Eurostat irrigation data:</text>
<text x='15.94' y='450.82' style='font-size: 9.80px;fill: #6B6B66; font-family: "Arial";' textLength='486.66px' lengthAdjust='spacingAndGlyphs'>AQUASTAT agricultural withdrawal scaled by 56% (hollow bars; not in the headline medians or models; France's</text>
<text x='15.94' y='461.40' style='font-size: 9.80px;fill: #6B6B66; font-family: "Arial";' textLength='197.20px' lengthAdjust='spacingAndGlyphs'>national statistics give 1,902 m3/ha for 2020).</text>
