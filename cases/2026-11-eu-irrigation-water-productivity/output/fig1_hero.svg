<text x='15.94' y='408.48' style='font-size: 9.80px;fill: #6B6B66; font-family: "Arial";' textLength='478.44px' lengthAdjust='spacingAndGlyphs'>AQUASTAT via World Bank (accessed 2026-11-26). Irrigation abstraction (not water applied at the field), mean</text>
