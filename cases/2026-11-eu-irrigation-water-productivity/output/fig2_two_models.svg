<text x='15.94' y='411.59' style='font-size: 9.80px;fill: #6B6B66; font-family: "Liberation Sans";' textLength='497.43px' lengthAdjust='spacingAndGlyphs'>constant returns to scale, rainfed cropland, irrigated area and water. Most of the gap comes from returns to</text>
<text x='15.94' y='422.18' style='font-size: 9.80px;fill: #6B6B66; font-family: "Liberation Sans";' textLength='492.96px' lengthAdjust='spacingAndGlyphs'>scale (87 points on average; splitting land: 0). Dropping one frontier country moves a single share by up to</text>
<text x='15.94' y='432.76' style='font-size: 9.80px;fill: #6B6B66; font-family: "Liberation Sans";' textLength='471.45px' lengthAdjust='spacingAndGlyphs'>88 points (A) and 96 (B). Model B mostly compares crop value per m3 with largely rainfed peers (rank</text>
<text x='15.94' y='443.34' style='font-size: 9.80px;fill: #6B6B66; font-family: "Liberation Sans";' textLength='90.03px' lengthAdjust='spacingAndGlyphs'>correlation -0.997).</text>
