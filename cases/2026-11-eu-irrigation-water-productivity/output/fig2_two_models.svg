<text x='15.94' y='390.42' style='font-size: 9.80px;fill: #6B6B66; font-family: "Liberation Sans";' textLength='549.89px' lengthAdjust='spacingAndGlyphs'>AQUASTAT via World Bank (accessed 2026-11-20). Water-directional DEA, means 2020-2022, output crop production</text>
