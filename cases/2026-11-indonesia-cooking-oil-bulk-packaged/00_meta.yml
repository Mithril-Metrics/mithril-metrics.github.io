identification: >
  Absent the 16 March 2022 switch, the log price gap between branded packaged and bulk cooking oil in
  the same province would have stayed where it was in the last capped week; shocks that hit both oils
  alike (world palm oil, the rupiah, local demand) cancel in the gap. All provinces switched in the
  same week, so the result is the response to the whole switch, compared against 2017-2021 changes,
  not a causal effect of the cap removal alone.

