decisions:
  api: "https://www.bi.go.id/hargapangan/WebSite/TabelHarga/GetGridDataKomoditas"
  commodities: {bulk: "com_17", pkg1: "com_18", pkg2: "com_19"}
  weekly_start: "2021-10-04"      # a Monday: PIHPS counts weeks from the start date
  weekly_end: "2022-08-29"
  window_end: "2022-06-27"        # last week used; Minyakita launched 6 Jul 2022
  monthly_start: "2017-01-01"
  monthly_end: "2022-12-31"
  event_week: "2022-03-14"        # k = 0, contains the switch on Wed 16 Mar (partly treated)
  ref_k: -1                       # week of 7 Mar 2022, last full capped week
  precap_k: [-23, -9]             # weeks 4 Oct 2021 - 10 Jan 2022, before any cap
  cap_k: [-6, -2]                 # weeks 31 Jan - 28 Feb 2022, descriptive joint test
  post_preban_k: [1, 6]           # 21 Mar - 25 Apr 2022
  ban_k: [7, 10]                  # 2 - 23 May 2022, shown, not summarised
  post_ban_k: [11, 15]            # 30 May - 27 Jun 2022
  outlier_jump: 0.40              # drop province-weeks with a week-on-week change above 40%
  producer_threshold: 0.02        # share of 2021 national production
  placebo_months: ["2017-03", "2021-12"]
  placebo_base: "2022-02"         # last full capped month
  placebo_targets: ["2022-03", "2022-04", "2022-05", "2022-06"]
  ramadan_months: ["2017-05", "2017-06", "2018-05", "2018-06", "2019-05", "2019-06",
                   "2020-04", "2020-05", "2021-04", "2021-05"]
  inference: "CR2 by province, Satterthwaite df (clubSandwich); HTZ Wald for joint tests"
  confirmatory: ["beta post_preban", "beta post_ban", "gamma post_preban"]

