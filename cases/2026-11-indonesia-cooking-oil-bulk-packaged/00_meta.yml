    Province palm oil production 2021 (producer_2021 below) typed from Ditjenbun, Statistik
    Perkebunan Unggulan Nasional 2021-2023, Table 1.6 "Jumlah/Total" column (tonnes CPO).
    Checked 2026-11-27: provinces add up to the printed regional subtotals and to the national total
    45,121,480 t. Provinces shown as "-" are entered as 0.

identification: >
  Absent the 16 March 2022 switch, the log price gap between branded packaged and bulk cooking oil in
  the same province would have stayed where it was in the last capped week; shocks that hit both oils
  alike (world palm oil, the rupiah, local demand) cancel in the gap. All provinces switched in the
  same week, so the result is the response to the whole switch, compared against 2017-2021 changes,
  not a causal effect of the cap removal alone.

method_track:
  choice: "E"
  reason: "Track M not used: 31 provinces leave about 15 units per fold for cross-fitting; one pre-specified moderator answers the policy question more transparently."
