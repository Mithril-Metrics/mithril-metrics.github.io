id: "2026-11-indonesia-cooking-oil-bulk-packaged"
issue: 7
local_folder: "Issue 7"
author: "Pietro Sala"
title: "When Indonesia freed packaged cooking oil from its price cap in March 2022, how far did it drift from capped bulk oil, and did bulk oil stay at its cap?"
question: >
  After Indonesia removed the retail price cap on packaged cooking oil on 16 March 2022 and kept a
  higher cap on bulk oil, how far did the two prices drift apart in traditional markets, did bulk oil
  stay at its cap, and did this differ in palm-oil-producing provinces?
