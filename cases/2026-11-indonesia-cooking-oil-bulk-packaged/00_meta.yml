known_limitations:
  - "On 16 March packaged oil lost its cap, but bulk oil's cap also rose by about a fifth and its supply was subsidised; in the same week the domestic-supply obligation for palm oil was scrapped and the export levy raised [verify at P8], and world vegetable oil prices were in the Ukraine-war spike. The gap measures this whole bundle, not the cap removal alone."
  - "Bulk oil was itself regulated and often short, so it is a comparison product, not an untouched control."
  - "Every province switched in the same week, so we cannot separate the switch from other nationwide shocks that week. The 95% intervals show how consistently provinces moved, not uncertainty about what caused the move. The 2022 change exceeds all of the 54-57 overlapping changes of the same length in 2017-2021, which amount to only about 15 independent ones: it was unusual, which says nothing about its cause."
  - "Ramadan began in early April 2022 and the export ban ran from 28 April to 23 May; both fall inside the post period. The June widening mostly reflects bulk prices easing during and after the export ban, while packaged prices stayed high."
  - "The week before the switch was already capped and short of supply; we also report the gap against the months before any cap."
  - "PIHPS records prices where oil was found; it cannot show shortages."
  - "We assume bulk oil is the cheaper option mainly bought by lower-income households; we do not observe who buys it and do not estimate incidence."
  - "With 11 producing provinces against 20 others, the 95% interval for the difference runs from about -3% to +29%: we can rule out neither no difference nor a large one. Two provinces (Bengkulu, Maluku Utara) have no price in the reference week and drop out of the province chart."
  - "PIHPS prices are per litre, the same unit as the caps; the packaged series are branded refill pouches, so they compare with the premium-packaging cap."
  - "In traditional markets neither cap was met even while both applied: in February to mid-March bulk sold about half above its cap and packaged oil about two-fifths above. Lifting the packaged cap removed a rule these markets were not meeting; the change is more likely in supply returning at market prices, which price data cannot show."
  - "In February, under the caps, the gap was already closing in on its 7 March level by about 1 point a week as bulk prices eased towards their cap. If that drift had simply continued, it would account for about half of the six-week widening across provinces, so that figure lies between the drift-adjusted and the unadjusted estimate. The drift came from the caps themselves and probably stopped once the bulk cap was raised, so the adjusted figure is a lower bound; carried four months forward it is implausible."
  - "Province averages count each province equally; national PIHPS figures are given alongside (the median province and the national bulk price agree closely)."
  - "Both Sulawesi Tenggara series roughly double from March 2022, likely a recording change; results without it are similar. Nusa Tenggara Timur's bulk price sits at exactly Rp13,500 for months and may be a stale entry. Kepulauan Bangka Belitung, Maluku and Papua Barat have no bulk series; the weeks of 28 February and 2 May 2022 have no prices in any province."
  - "PIHPS is an undocumented public interface; we publish only derived numbers."

pre_results_review: >
  P4 review 2026-11-27 by a policy analyst (World Bank lens) and an econometrician (field-journal
  referee), both PROCEED WITH CHANGES. Adopted: estimand as the whole switch with a packaged/bulk
  decomposition and bulk-vs-cap co-headline; 2017-2021 time placebo as headline inference; CR2 with
  Satterthwaite df and three confirmatory tests; fixed outlier rule, window and threshold; wording
  rules for titles. Implementation note (P5): the heterogeneity model interacts every event week
  (not only k >= 0) with Producer, so producer and other provinces each keep their own pre-switch
  path and gamma is measured against the same reference week.
  Deviation at P6 (2026-11-27): the P4 outlier rule (week-on-week jump above 40%) removed 12
  province-weeks, 7 of them packaged prices jumping in the two weeks after the 16 March switch, i.e.
  the response being measured. A level rule (price more than 40% from the national price) was tried
  and dropped before any summary estimate was read: it removed 90 province-weeks, including prices at
  the caps (Bengkulu, Nusa Tenggara Timur) and real remote prices (Maluku Utara, Papua). Main estimate
  uses all recorded prices; checks: the P4 jump rule, and the main model without Sulawesi Tenggara,
  whose packaged price is about twice the national price from 7 March to June 2022 (likely a
  2-litre pouch recorded as 1 litre; at P7 both of its series were found to double, so more likely a
  recording change).
  P7 (2026-11-27): the time placebo compares each 2022 month (March to June) with all 2017-2021 changes
  of the same length (1 to 4 months); the plan text listed 1-3 months with targets April-June. A
  drift-adjusted contrast (caps-period linear trend carried forward) and Holm-adjusted p-values were
  added after both red-team reviews.

