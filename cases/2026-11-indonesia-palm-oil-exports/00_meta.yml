# 00_meta.yml — single source of truth for this case's metadata.
# report.qmd reads this file for the hook, the "Data & code" section and the footer.
# 02_clean.R reads the policy dates, Eid months and price caps from here.

id: "2026-11-indonesia-palm-oil-exports"
issue: 6
local_folder: "Issue 6"
author: "Pietro Sala"
title: "How far did Indonesia's cooking-oil price move away from its usual link to world palm oil prices during the 2022 export curbs?"
question: >
  How far did Indonesia's national retail cooking-oil price shift relative to the level implied by
  the world crude palm oil price in rupiah during the January-May 2022 policy bundle (domestic
  market obligation, retail price caps, a four-week export ban), and after it?
bottom_line: null                 # written at the WRITE stage from key_numbers.csv
status: red-teamed                      # plan | code | results | red-teamed | draft | published
publish_at: null                  # set only after both authors approve

hook:
  debate: >
    Indonesia's Trade Regulation 16/2026 routes crude palm oil exports through a single state-owned
    exporter: a transition from 1 June to 31 December 2026, with the state exporter as sole exporter of
    record from 1 January 2027. It changes export channels rather than imposing a ban or a supply
    obligation, so 2022 is only a partial analogue. The last time export channels were administered was 2022.
  date: "2026-06-10"
  primary_source:
    title: "Indonesia's Future of Palm Oil Exports after New Ministerial Regulation (RRI, 10 Jun 2026)"
    url: "https://rri.co.id/en/national/2480326/indonesias-future-of-palm-oil-exports-after-new-ministerial-regulation"
  second_source:
    title: "PwC Indonesia Legal Alert 2026-67 (August 2026)"
    url: "https://www.pwc.com/id/en/pwc-publications/services-publications/legal-publications/legal-alert-2026-67.html"

