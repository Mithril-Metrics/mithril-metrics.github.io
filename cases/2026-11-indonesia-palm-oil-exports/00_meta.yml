manual_steps: []                  # all prices come from the FPMA API; policy dates are below with their sources

identification: >
  Conditional on how the retail price normally follows the world palm oil price in rupiah (lags 0-2),
  nothing other than the 2022 policy bundle shifted Indonesian retail cooking-oil prices in January-May
  2022; wheat flour, which the palm oil rules did not touch, tests for shocks common to both.

method_track:
  choice: "E"
  reason: "Track M infeasible: 69 monthly observations, one unit, no high-dimensional controls or heterogeneity question."
  ml_settings: null

# ---- Fixed at P4 (2026-11-25), before any results ----
decisions:
  budget_option: "a"
  sample: ["2020-11-01", "2026-07-01"]
  world_price_lags: [0, 1, 2]
  phases:
    window: ["2022-01-01", "2022-05-01"]        # DMO, price caps, export ban 28 Apr - 23 May 2022
    window_a: ["2022-01-01", "2022-03-01"]      # R1: DMO + full retail caps (March mixes both regimes)
    window_b: ["2022-04-01", "2022-05-01"]      # R1: packaged caps lifted 16 Mar, bulk cap 14,000; export ban from 28 Apr
    pre3: ["2021-10-01", "2021-12-01"]          # P6 check: the three months before the window
    post_start: "2022-06-01"                    # DMO regime continues
    bps_change: "2023-01-01"                    # BPS sample 90 -> 150 districts
  eid_al_fitr_months: ["2021-05-01", "2022-05-01", "2023-04-01", "2024-04-01", "2025-03-01", "2026-03-01"]
  inference: >
    Regression with AR(1) errors (stats::arima, ML) gives the primary standard errors; OLS with
    Newey-West HAC (lag 3, prewhitened) is the check. gamma_window is the single primary test; Holm
    adjustment across gamma_window, gamma_post and delta_bps. Placebo outside the family. No bootstrap.
  placebo: "wheat flour vs US HRW wheat in rupiah, same specification"
  robustness:
    R1: "Window split into Jan-Mar 2022 and Apr-May 2022"
    R2: "Dropped at P6: one-for-one gaps move with the world price cycle, the reason they were rejected at P4"
  units: "Phase effects in % (100*(exp(b)-1)) and IDR/litre at the 2021 mean retail price"
  footnote_only: "World Bank Pink Sheet palm oil (same market as Oil World c.i.f. Rotterdam)"

# ---- Added at P6 (2026-11-26), after the first results ----
# Checks only: the primary test (gamma_window, AR(1) SE, Holm) is unchanged.
p6_checks:
  S1: "World-price lags 0-5 instead of 0-2"
  S2: "World-price link estimated without 2022 (2022 months set to missing in the AR(1) likelihood); gap = retail minus that link"
  S3: "Pass-through imposed on a grid from 0.1 to 0.9 (equal weights on lags 0-2); window and Apr-May shifts re-estimated"
  S4: "Dummy for the three months before the window (Oct-Dec 2021): does the gap move before any measure?"
  S5: "Placebo in time: the same model with a fake 5-month (and 2-month) window at every position outside Jan-May 2022"
  newey_west: "Reported with its own OLS estimate; it is not a p-value for the AR(1) estimate"
  placebo_note: "Wheat flour does not follow world wheat in this sample (pass-through near zero, AR(1) near 1), so the placebo is weak"

events_2022:
  - {date: "2022-02-01", label: "Retail caps (bulk Rp11,500)", source: "Jakarta Post, 18 Mar 2022"}
  - {date: "2022-03-16", label: "Packaged caps lifted", source: "Jakarta Post, 18 Mar 2022"}
  - {date: "2022-04-28", label: "Export ban (to 23 May)", source: "FAO FAPDA; Trade Regulation 30/2022"}

# Retail price caps (HET) drawn in Fig 1. They apply to bulk / 'people's' cooking oil, not to the
# whole BPS series, which mixes bulk and packaged oil.
price_caps:
  - {from: "2022-02-01", to: "2022-03-15", idr_per_litre: 11500, label: "Bulk oil cap",
     source: "Jakarta Post, 18 Mar 2022, https://www.thejakartapost.com/business/2022/03/18/govt-removes-price-cap-on-cooking-oil.html"}
  - {from: "2022-03-16", to: "2024-08-13", idr_per_litre: 14000, label: "Bulk oil / MinyaKita cap",
     source: "Jakarta Post, 18 Mar 2022 (bulk cap); Bisnis.com, 17 Aug 2024 (MinyaKita cap raised from 14,000)"}
  - {from: "2024-08-14", to: "2026-07-31", idr_per_litre: 15700, label: "MinyaKita cap",
     source: "Antara, Aug 2024, https://makassar.antaranews.com/berita/553303/kemendag-menetapkan-het-minyakita-sebesar-rp15700-per-liter"}

known_limitations:
  - "The estimate covers the whole 2022 policy bundle; monthly data cannot isolate the export ban from the price caps and supply obligations."
  - "The window spans five months, so its estimate is close to a five-month average and its confidence interval is wide."
  - "The measures followed a price spike in late 2021, so part of any fall during the window may be prices returning to normal."
  - "BPS widened its price sample from 90 to 150 districts in January 2023; the 2023 shift mixes that change with any policy drift."
  - "The series mixes bulk and packaged cooking oil, and posted prices under a cap can understate what households paid when oil was scarce."
  - "Lower consumer prices were paid partly by producers; farm-gate fresh-fruit-bunch prices are not analysed here."
  - "One country and one episode; the result does not predict the effect of the 2027 state-exporter scheme."
  - "March 2022 mixes both regimes and is assigned to the first sub-phase in R1."
  - "The world-price link is estimated in months that had caps or supply obligations (2022 onward), which may flatten it; S2 and S3 show how much this matters."
  - "The BPS national average sits well above the bulk / MinyaKita caps throughout, so the series mostly reflects packaged or uncapped oil; check the BPS definition before writing."
  - "The gap already moved before any measure (Oct-Dec 2021, S4), so the five-month window estimate depends on which months serve as the baseline."
  - "The Jan-Mar / Apr-May split (R1) was a planned check, not the primary test; April 2022 is mostly before the export ban."

pre_results_review: >
  2026-11-25. World Bank policy analyst and field-journal econometrician, both PROCEED WITH CHANGES.
  Adopted: pass-through model with phase dummies instead of a one-for-one gap; one Post phase plus a
  BPS 2023 dummy; AR(1) errors with Newey-West check and Holm; Eid dummy; R1 window split; R2
  difference of gaps; price caps and IDR/litre units; non-causal wording. Not adopted: dropping
  March (would be a third robustness check).

