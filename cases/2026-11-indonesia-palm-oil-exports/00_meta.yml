known_limitations:
  - "The estimate covers the whole January-May 2022 bundle: a Rp14,000 one-price policy with subsidy from 19 January, the domestic market obligation from 27 January, retail caps from 1 February, an export quota from 9 March, the end of packaged-oil caps on 16 March, a higher export-levy ceiling ($175 to $375 per tonne) from mid-March, and the export ban of 28 April-23 May; the levy was then suspended from mid-July to 31 August 2022. Monthly data cannot isolate any one of them; January is partly treated."
  - "With persistent month-to-month errors (AR(1) 0.82), the pre-specified estimate weights January 2022 against December 2021 most heavily (about +0.76 and -0.75; every other month 0.18 or less). It therefore mainly measures whether the gap jumped at the start of the window. Weighting all months equally gives +14.9% (OLS) or +13.0% (raw difference in mean gaps). If the shift had been the same every month these would agree; their divergence shows it was not."
  - "The gap widened by about 10% in October-December 2021 (95% CI 4% to 16%), before any of the 2022 measures (a progressive export levy was already in force); adding those months as their own period moves the window estimate from +4% to +16%. Part of any later fall may be the late-2021 spike unwinding."
  - "Moving the phases by one month turns the window estimate to -10% (95% CI -14% to -6%), the Apr-May shift from +16% to -12% and the post-June shift from +6% to -13%, although the observed gaps after mid-2022 stay positive; by two months the window is +3%. Each shifted estimate mainly compares its new first month with the month before (Feb vs Jan, Mar vs Feb). All three are reported; none is selected."
  - "The post-June 2022 shift is +6% (95% CI -2% to +14%) in the main model but +14% (8% to 20%) when the window is split as planned (R1), so the post-2022 level is model-dependent."
  - "A time placebo puts fake windows elsewhere in the series: only 1 of 56 five-month windows reaches +4%, and no two-month window reaches the Apr-May +16% (largest 7%). The fake windows fall mostly in the calm months after 2022, so this is weak evidence on how unusual 2021-22 movements were."
  - "Retail cooking oil normally passes on only about a third of world-price changes within three months (elasticity 0.31). A shift relative to that link is not a shift relative to world prices: in January-May 2022 world palm oil in rupiah rose about 40% and retail cooking oil about 24% on their 2021 averages."
  - "Indonesia's own measures moved the world palm oil price used as the benchmark, and the export levy and duty rise with the world price, so in 2022 the predicted level is not a policy-free counterfactual; any effect working through world prices is not captured, and the ban could move both lines at once."
  - "The series is the national average retail price, which in 2022 sat well above every cap (Rp19,349 per litre in February 2022, 38% above the highest cap in force). It mostly reflects packaged or uncapped oil sold where available and does not show the price of capped oil, how much capped oil households could buy, regional differences, or exporters' and smallholders' prices, where a change in export channels such as the 2027 scheme acts first."
  - "FPMA labels the series 'vegetable oil, national average, BPS'. BPS's current monitoring records palm cooking oil in three variants (bulk, MinyaKita, premium packaged); which variants and weights the series uses, especially before 2022, could not be confirmed."
  - "The world-price link is estimated mostly on months under a supply obligation or the MinyaKita cap. Estimating it without 2022 leaves April-May unchanged (13.3%) but lowers the post-2022 gap from 7.0% to 3.6%. Without 2022, the post-policy shift and the BPS sample change start in the same month and cannot be separated, so the 3.6% treats the whole 2023 level change as a sampling change. The post-2022 level is the least reliable number."
  - "Wheat flour barely follows world wheat (pass-through 0.06, AR(1) 0.99) and its own window shift is small but significant (+1.9%, p = 0.04; its interval excludes zero), so the placebo cannot rule out common shocks and suggests the intervals may be too narrow."
  - "Month-by-month estimates (Fig 2) are measured against November 2020 - September 2021 and against neighbouring months, so their levels are not comparable with Fig 1; intervals at the ends of the period are narrow because those months are pinned by the observed months next to them."
  - "BPS widened its price sample from 90 to 150 districts in January 2023; the shift that month is about 19% for wheat flour, so the small cooking-oil estimate (-2.1%) does not show the change was harmless in general."
  - "A four-week export ban (28 April-23 May), averaged into monthly prices that also contain Eid, may not be visible at this frequency; 'no further break in May' does not mean the ban had no effect."
  - "Ramadan 2022 fell in April, the month of the jump; the Eid dummy marks May only. Ramadan months in other years show no jump in the gap, but some April demand effect cannot be excluded."
  - "IDR per litre figures are at 2021 average prices; at early-2022 price levels the same percentage is roughly a fifth larger."
  - "Lower consumer prices were paid partly by producers; farm-gate fresh-fruit-bunch prices are not analysed here."
  - "One country and one episode; the result does not predict the effect of the 2027 state-exporter scheme."

write_notes:
  - "Headline (P7 round 2): Our pre-specified test finds no clear shift in Indonesia's retail cooking-oil price relative to its usual link with world palm oil over January-May 2022 (+4%, 95% CI -2% to +11%). Because the gap carries over from month to month, that test mainly compares January 2022 with December 2021, when the gap had already widened by about 10% before the 2022 measures; weighting the five months equally, the gap averaged 13-15% above its earlier level. Split as planned, January-March shows no shift (+1%) and April-May +16% (about Rp2,700 per litre at 2021 prices), after the packaged-oil caps were lifted on 16 March. The data cannot separate this from other shocks, and May, when the four-week export ban fell, shows no further break."
  - "Cite R1 (planned) before S6 (added after first results); label OLS, S4, S5, S6 and S7 as checks added after first results."
  - "One sentence near the top: world palm oil in rupiah rose about 40% and retail cooking oil about 24% (Jan-May 2022 vs 2021); retail normally passes on about a third of world-price changes within three months."
  - "A short 'What this cannot tell a policy team' paragraph: who paid (one-price subsidy fund, refiners under the DMO, smallholders), regional spread and availability. Consistency checks to cite: Bisnis.com, 13 Apr 2022 (Kemendag bulk vs premium packaged prices) and Katadata, 19 May 2022 (PIHPS bulk prices by province)."
  - "Implication, conditional: if the 2027 scheme restricts export flows, the 2022 record suggests national average retail prices need not fall relative to their usual world-price link; effects on availability, regions and producers are not measured here."
  - "Technical note: report R2 (difference of gaps), planned at P4 and dropped after first results, as an appendix line with the reason."
  - "Context only, not confirmation: Putra and Patunru (2024, Journal of Southeast Asian Economies) on export restrictions and domestic CPO and cooking-oil prices; abstract seen only."
  - "Lead with the pre-specified test, then the comparison of estimators, then the month-by-month pattern; label S1-S7 as checks added after first results."
  - "Timing words: 'in the same or the following month', never 'within weeks'; 'after', never 'because of'."
  - "Call the benchmark 'the price predicted from world palm oil prices (a fitted relationship, not a parity price)'."
  - "Give the Apr-May shift also in IDR per litre (about Rp2,694 at the 2021 mean, R1); no share of household spending without a cited Susenas figure."
  - "One sentence on smallholders, labelled as farmer reports: Al Jazeera, 16 May 2022; Jakarta Post, 3 Aug 2022."
  - "Pink Sheet palm oil as a footnote only (same market as Oil World c.i.f. Rotterdam)."
  - "Do not cite the World Bank Indonesia Economic Prospects (June 2022) as support; reviewers could not confirm cooking-oil content."

p7_review: >
  2026-11-26. World Bank policy analyst and field-journal econometrician, both REVISE (light). Adopted:
  headline leads with the pre-specified test; estimator comparison table; corrected 2022 timeline
  (one price 19 Jan, DMO 27 Jan, packaged caps 1 Feb); Fig 1 and Fig 2 retitled as changes; t-value
  check; identification, tags and R2 wording; limitations rewritten. Caveat instead of fix: endogenous
  benchmark, series level vs caps, placebo, ban visibility.

p7_review_round2: >
  2026-11-26. Same two roles, fresh reviewers, both REVISE (light). Adopted: headline explains that the
  pre-specified estimate mainly compares Jan 2022 with Dec 2021 (effective weights added), cites R1 before
  S6, gives IDR per litre; Fig 1 retitled on the planned R1 periods; three more 2022 measures (export quota,
  levy ceiling, levy suspension); 'before any of the 2022 measures'; case retitled around the usual
  world-price link; S5 and R1 post disclosed; limitations rewritten; figure legibility; FPMA access dates.
  Moved to WRITE: 'what this cannot tell a policy team' paragraph with consistency sources; R2 appendix line.
  Removed from the hook: the 12.5% levy figure (no source found).

pre_results_review: >
  2026-11-25. World Bank policy analyst and field-journal econometrician, both PROCEED WITH CHANGES.
  Adopted: pass-through model with phase dummies instead of a one-for-one gap; one Post phase plus a
  BPS 2023 dummy; AR(1) errors with Newey-West check and Holm; Eid dummy; R1 window split; R2
  difference of gaps; price caps and IDR/litre units; non-causal wording. Not adopted: dropping
  March (would be a third robustness check).

