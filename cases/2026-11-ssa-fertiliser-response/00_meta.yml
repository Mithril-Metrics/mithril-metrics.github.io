identification: >
  The world urea-to-maize price ratio is set on world markets that these 14 countries do not
  move, so its relation to national maize yields, net of country effects, country trends and
  ENSO, is a reduced-form association with the whole input-cost shock (oil and freight move
  with urea). The difference between high- and low-subsidy countries is estimated with year
  fixed effects, but subsidy intensity is not random, so it is also an association.

decisions:                        # fixed in the PLAN stage (P4, 2026-11-19), before seeing results
  countries: [MWI, KEN, ETH, TZA, ZMB, ZWE, MOZ, UGA, NGA, GHA, BFA, MLI, BEN, RWA]
  years: [1990, 2024]
  ratio: "monthly urea $/t / maize $/t (Pink Sheet); crop year t = mean of Oct(t-1) to Sep(t)"
  baseline: "median of crop-year ratio 1990-2019; band = interquartile range of monthly ratio 1990-2019"
  outcomes: ["log maize yield (t/ha), headline", "log N agricultural use per ha of cropland (kg/ha)"]
  enso_control: "ONI Dec(t-1) to Feb(t) (DJF of year t), the peak of the southern African season"
  spec_a: "log y ~ log ratio + ONI | country FE + country linear trends; Driscoll-Kraay SE"
  spec_b: "log y ~ log ratio x high-subsidy | country FE + year FE; Driscoll-Kraay SE"
  subsidy_groups: >
    MAFAP B1 (variable inputs) / III (total support to food and agriculture), actual spending,
    total (national + donor) funding, mean over budget years starting up to 2019; high = above
    the median of the 14 countries
  robustness:
    - "R1: N use on official values only (FAOSTAT flags A or X)"
    - "R2: ratio lagged one more season, Oct(t-2) to Sep(t-1)"
    - "R3: leave one country out (spec A yield elasticity and spec B difference)"
  back_of_envelope: >
    implied % change = exp(beta * [log ratio 2026 crop year - log baseline median]) - 1;
    tonnes = implied % x 2024 maize production; 90% intervals from the coefficient's SE

