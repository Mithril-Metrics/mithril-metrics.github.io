manual_steps: []

identification: >
  The world urea-to-maize price ratio is set on world markets that these 14 countries do not
  move, so its relation to national maize yields, net of country effects, country trends and
  ENSO, is a reduced-form association with the whole input-cost shock (oil and freight move
  with urea). The difference between high- and low-subsidy countries is estimated with year
  fixed effects, but subsidy intensity is not random, so it is also an association.

decisions:                        # fixed in the PLAN stage (P4, 2026-11-19), before seeing results
  countries: [MWI, KEN, ETH, TZA, ZMB, ZWE, MOZ, UGA, NGA, GHA, BFA, MLI, BEN, RWA]
  years: [1990, 2024]
  ratio: "monthly urea $/t / maize $/t (Pink Sheet); crop year t = mean of Oct(t-1) to Sep(t)"
  baseline: "median of crop-year ratio 1990-2019; band = interquartile range of monthly ratio 1990-2019"
  outcomes: ["log maize yield (t/ha), headline", "log N agricultural use per ha of cropland (kg/ha)"]
  enso_control: "ONI Dec(t-1) to Feb(t) (DJF of year t), the peak of the southern African season"
  spec_a: "log y ~ log ratio + ONI | country FE + country linear trends; Driscoll-Kraay SE"
  spec_b: "log y ~ log ratio x high-subsidy | country FE + year FE; Driscoll-Kraay SE"
  subsidy_groups: >
    MAFAP B1 (variable inputs) / III (total support to food and agriculture), actual spending,
    total (national + donor) funding, mean over budget years starting up to 2019; high = above
    the median of the 14 countries
  robustness:
    - "R1: N use on official values only (FAOSTAT flags A or X)"
    - "R2: ratio lagged one more season, Oct(t-2) to Sep(t-1)"
    - "R3: leave one country out (spec A yield elasticity and spec B difference)"
  back_of_envelope: >
    implied % change = exp(beta * [log ratio 2026 crop year - log baseline median]) - 1;
    tonnes = implied % x 2024 maize production; 90% intervals from the coefficient's SE

after_results:                    # ADDED AFTER the first full run (2026-11-19), reported as such
  why: >
    Yields fell with the ratio while measured N use did not, and leaving Zimbabwe out moved the
    subsidy comparison. Both checks were chosen on economic grounds before running them.
  checks:
    - "D1 (diagnostic): urea and maize prices entered separately (nominal $/t, crop-year means)"
    - "R4 (exploratory): main and split models without Zimbabwe 2000-2009 (economic collapse coinciding with the 2008 spike)"
  figure_fixes:
    - "Fig 1: one peak per price episode (2007-09, 2021-22, 2025-26) instead of calendar-year maxima"
    - "Fig 2: subtitle says same crop year, not next season"

red_team:                         # P7, 2026-11-19 (reviewer stance: senior WB agriculture economist)
  fixes:
    - "F1: yield model without crop years 2008-2009, and without 2021-2022 (spike episodes)"
    - "F2: yield model on country-years with official N data (FAO flags A or X)"
    - "F3: MAFAP B1 share and real B1 (constant 2017 USD), budget year 2007 vs 2009"
    - "F4: back-of-envelope with the elasticity estimated without Zimbabwe 2000-2009; only the all-country row in the post"
    - "Fig 1: median label moved to the right margin"
  caveats:
    - "Yields fall with the ratio but measured N use does not: channel not identified by these data"
    - "Urea prices move with energy and freight: read as an energy-linked input-cost shock"
    - "Subsidy groups are not random; B1 covers seeds, energy and credit; on-budget only"
    - "National averages, world prices, 14 countries chosen for MAFAP coverage"
    - "Back-of-envelope is a conditional benchmark against a typical ratio, not a forecast"
    - "ENSO control covers 1990-2024 only; the 2026/27 El Nino is outside the data"
    - "D1, R4 and F1-F4 were added after the first results; headline is the pre-specified spec A"
  do_not_claim:
    - "agronomic N-response numbers (not in our data)"
    - "named governments expanding subsidies in 2008 or 2022, beyond what tab_subsidy_2008.csv shows"

red_team_2:                       # P7, 2026-11-20: separate policy (World Bank) and econometric reviews
  verdicts: {policy: "REVISE", econometrics: "REVISE"}
  checks_added:
    - "B2: subsidy split with country trends and ENSO x group next to year FE, 2005-2024 only"
    - "R5: urea/maize ratio over the six months before each region's main planting (S: Jun-Nov t-1; E: Sep t-1-Feb t; W: Dec t-1-May t)"
    - "T1: 35 yearly means of residual yield on residual ratio, Newey-West (2 lags), t critical values"
    - "R3 extended: leave-one-out maximum of the high-low yield difference and its interval reported"
  text_fixes:
    - "Headline reworded as an association; lagged-ratio result (R2) reported next to it"
    - "Subsidy section retitled: fertiliser use kept up, yield evidence inconclusive; Zimbabwe leave-one-out reported"
    - "Back-of-envelope: one interval (main estimate), framed as a benchmark for seasons planted after the spike; tonnes out of key figures and LinkedIn"
    - "Early-warning implication dropped; world vs farm-gate prices caveat added"
    - "n_imputed_pct label: values not flagged A or X, including missing flags"
    - "Fig 1 subtitle: estimates use crop-year averages; Fig 2 title: no clear yield difference"

