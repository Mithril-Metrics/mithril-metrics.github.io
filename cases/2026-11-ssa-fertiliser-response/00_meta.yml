id: "2026-11-ssa-fertiliser-response"
issue: 2
local_folder: "Issue 2"
author: "Pietro Sala"
title: "Do fertiliser price spikes shrink maize harvests in Sub-Saharan Africa?"
question: >
  How far is the fertiliser-to-maize price ratio from its historical norm in 2026, how strongly
  did maize yields and nitrogen use in 14 Sub-Saharan African countries move with that ratio
  over 1990-2024, and was the response weaker in countries that spend more on input subsidies?
bottom_line: null                 # written at the WRITE stage from key_numbers.csv
status: draft                     # plan | code | results | red-teamed | draft | published

hook:
  debate: >
    Fertiliser prices rose sharply after the Strait of Hormuz closed in February 2026. The OECD
    Agricultural Policy Monitoring and Evaluation 2026 report (2 Nov 2026) uses its support data
    to look at past policy responses to fertiliser price rises, but covers only South Africa in
    Sub-Saharan Africa; its policy brief on fertilisers (19 Oct 2026) stresses import dependence.
  date: "2026-10-19"
  primary_source:
    title: "OECD (2026), Agricultural resilience and food security in an interconnected world: lessons from fertilisers"
    url: "https://www.oecd.org/en/publications/agricultural-resilience-and-food-security-in-an-interconnected-world_daa053c8-en.html"
  other_sources:
    - title: "OECD (2026), Agricultural Policy Monitoring and Evaluation 2026"
      url: "https://www.oecd.org/en/publications/agricultural-policy-monitoring-and-evaluation-2026_2c7f3be1-en.html"
    - title: "ICC (Aug 2026), Safeguarding food security amid the Hormuz crisis"
      url: "https://iccwbo.org/news-publications/policy-paper/safeguarding-food-security-amid-the-hormuz-crisis/"

