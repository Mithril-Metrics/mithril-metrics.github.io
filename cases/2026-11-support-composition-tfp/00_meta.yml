manual_steps: []

identification: >
  Descriptive association. AKIS intensity is not randomly assigned: governments may spend more
  on research where the sector is already doing well (reverse causality), and countries differ
  in ways the controls (initial income, TFP growth in 1991-2000) only partly capture. The
  long-difference coefficient compares countries; the fixed-effects panel compares each country
  with itself but with a lag (5 years) too short for most returns to research.

decisions:                        # fixed in the PLAN stage (P4, 2026-11-23), before seeing results
  units_regressions: "29 non-EU PSE countries; EU only in the descriptive outputs; OECD total dropped"
  coverage_rule: "a unit enters a window with >= 3 years of non-missing AKIS and value of production"
  akis: "AKIS spending = GSSEHSH (% of GSSE) / 100 x GSSE; regressor = AKIS / value of production (VP), %"
  other_regressors: "MPS / VP (%, may be negative); infrastructure (GSSEJSH) / VP (%); public stockholding enters no regressor"
  ratio: "ratio of sums over each window (see after_plan for the currency used in the sums)"
  growth: "100 x OLS slope of ln TFP_Index on year within the window, base year included"
  long_difference: >
    g(2009-2023) ~ AKIS/VP 2000-09 + MPS/VP 2000-09 + INFRA/VP 2000-09 + ln GDP pc PPP 2000-04
    + g(1990-2000); one row per country; unweighted
  fe_check: >
    g(period p) ~ AKIS/VP, MPS/VP, INFRA/VP in period p-1 | country + period FE; outcome periods
    2005-09 (2004-09), 2010-14 (2009-14), 2015-19 (2014-19), 2020-23 (2019-23); lagged windows
    2000-04, 2005-09, 2010-14, 2015-19
  primary_coefficient: "beta1 on AKIS/VP; other coefficients are reported without inference claims"
  inference_ld: "HC3 standard errors; permutation p-value, 9,999 draws"
  inference_fe: "CR2 by country with Satterthwaite df (clubSandwich); wild cluster bootstrap-t (restricted, Webb weights, 9,999 draws)"
  scale: "effects reported per within-sample SD of AKIS/VP and per 0.1 pp"
  robustness:
    - "R1: leave one country out (long difference)"
    - "R2: without IND, CHN, IDN, PHL (public stockholding is a large part of their GSSE)"
  rebalancing: >
    per unit (30, EU included): AKIS/VP 2000-04 (base) vs 2023-25; gap = max(base - now, 0) x VP
    2023-25, USD bn a year; gap as % of MPS 2023-25 where MPS > 0; MPS as % of TSE where TSE > 0
  dumbbell_windows: "AKIS/VP 2000-04 vs 2021-25"
  title_rule: >
    figure 2 and the headline say "a positive" or "a negative association" only if the
    permutation p-value is below 0.10; otherwise "no clear association"

after_plan:                       # choices made while coding, before any result was seen
  - >
    Ratios of sums are taken in USD (each year's AKIS, MPS and VP converted at the same annual
    rate, so every single-year ratio is unchanged). Summing in national currency would give
    almost all the weight to the last year in high-inflation economies (Argentina, Türkiye).
  - >
    The permutation test permutes residuals of the model without AKIS (Freedman-Lane) rather
    than AKIS itself, because AKIS is correlated with the controls; permuting AKIS alone would
    test its independence from all regressors, not beta1 = 0.
  - "The wild cluster bootstrap is coded directly (no extra package)."

