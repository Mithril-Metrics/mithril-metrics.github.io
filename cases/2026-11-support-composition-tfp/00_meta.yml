id: "2026-11-support-composition-tfp"
issue: 5
local_folder: "Issue 5"
author: "Pietro Sala"
title: "Research and extension spending versus price support: what goes with faster farm productivity growth?"
question: >
  Did economies that spent a larger share of their farm output value on agricultural research,
  extension and education (the OECD's agricultural knowledge and innovation system, AKIS) in
  2000-2009 see faster agricultural TFP growth in 2010-2023, and what would it cost to return
  each economy to its 2000-04 spending intensity?
bottom_line: null                 # written at the WRITE stage from key_numbers.csv
status: draft                     # plan | code | results | red-teamed | draft | published
publish_at: null

hook:
  debate: >
    The OECD Agricultural Policy Monitoring and Evaluation 2026 report (2 Nov 2026) finds that
    total support to agriculture averaged USD 885 bn a year in 2023-25 across 56 countries, that
    general services support fell from 4.6% of the value of production in the early 2000s to
    2.4% in 2023-25, and that agricultural TFP growth slowed from 1.8% a year in 1991-2000 to
    0.8% in 2014-2023. It recommends rebalancing support toward knowledge and innovation.
  date: "2026-11-02"
  primary_source:
    title: "OECD (2026), Agricultural Policy Monitoring and Evaluation 2026"
    url: "https://www.oecd.org/en/publications/agricultural-policy-monitoring-and-evaluation-2026_2c7f3be1-en.html"
  other_sources:
    - title: "OECD (2026), Reforming agricultural policies for greater resilience (policy brief)"
      url: "https://www.oecd.org/en/publications/reforming-agricultural-policies-for-greater-resilience_2cb067af-en/full-report"
    - title: "OECD press release (2026), Government support to agriculture grew by 15 per cent in the last two years"
      url: "https://www.oecd.org/en/about/news/press-releases/2026/10/government-support-to-agriculture-grew-by-15-per-cent-in-the-last-two-years-and-much-of-it-is-distortive-says-oecd.html"

